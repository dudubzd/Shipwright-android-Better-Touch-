name: Generate Signing Key (one time)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Generate keystore and save secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
          AL: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$GH_TOKEN" ] || [ -z "$PW" ] || [ -z "$AL" ]; then
            echo "Missing secrets: GH_PAT, SIGNING_KEY_PASSWORD, SIGNING_KEY_ALIAS"
            exit 1
          fi
          # Safety: never replace an existing key
          if gh secret list --repo "$GITHUB_REPOSITORY" | grep -q '^SIGNING_KEYSTORE_B64'; then
            echo "SIGNING_KEYSTORE_B64 already exists. Aborting so the key is not replaced."
            exit 1
          fi
          keytool -genkeypair -keystore release.jks -alias "$AL" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=SOH Better Touch"
          base64 -w0 release.jks | gh secret set SIGNING_KEYSTORE_B64 --repo "$GITHUB_REPOSITORY"
          # Backup encrypted with your password
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PW -in release.jks -out release.jks.enc

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: release-key-backup-ENCRYPTED
          path: release.jks.enc
          retention-days: 7
